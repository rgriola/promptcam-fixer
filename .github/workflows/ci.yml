name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded in-progress runs for the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Xcode major version required by the project (Swift 6.0 / iOS 18 SDK).
  XCODE_VERSION: "16"

jobs:
  lint:
    name: Lint & Format
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install tools (XcodeGen, SwiftLint, SwiftFormat)
        run: brew install xcodegen swiftlint swiftformat

      - name: Generate Xcode project
        run: xcodegen generate

      - name: SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .

  build-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCHEME: PromptCam
      PROJECT: PromptCam.xcodeproj
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install tools (XcodeGen, xcbeautify)
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          # Pick the newest available iPhone simulator so we don't depend on a
          # hard-coded device name that may not exist on the runner image.
          xcrun simctl list devices available --json > devices.json
          DEVICE=$(python3 "$GITHUB_WORKSPACE/.github/scripts/pick_simulator.py" devices.json)
          if [ -z "$DEVICE" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Selected simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build & test (unit tests)
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -only-testing:PromptCamTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify

      - name: Upload xcresult bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
