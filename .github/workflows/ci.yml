name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded in-progress runs for the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: CI only needs to read repository contents.
permissions:
  contents: read

env:
  XCODE_VERSION: "26.3"
  IOS_SIMULATOR_RUNTIME: "26.2"

jobs:
  lint:
    name: Lint & Format
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install pinned lint tools
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip -o "$RUNNER_TEMP/swiftlint.zip"
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          curl -fsSL --retry 3 https://github.com/nicklockwood/SwiftFormat/releases/download/0.62.1/swiftformat.zip -o "$RUNNER_TEMP/swiftformat.zip"
          echo "7cb1cb1fae04932047c7015441c543848e8e60e1572d808d080e0a1f1661114a  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          xcodebuild -version
          swiftlint version
          swiftformat --version

      - name: SwiftLint
        id: swiftlint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

      - name: SwiftFormat (lint mode)
        if: ${{ !cancelled() && steps.swiftlint.outcome != 'skipped' }}
        run: swiftformat --lint . --reporter github-actions-log

  build-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCHEME: PromptCam
      PROJECT: PromptCam.xcodeproj
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install pinned build tools
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          curl -fsSL --retry 3 https://github.com/cpisciotta/xcbeautify/releases/download/3.2.1/xcbeautify-3.2.1-universal-apple-macosx.zip -o "$RUNNER_TEMP/xcbeautify.zip"
          echo "87fdbe786f71d7b2ee28c5c1ca97087587292f2c5c6f9e721cf02db8b2a3c241  $RUNNER_TEMP/xcbeautify.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcbeautify.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/release" >> "$GITHUB_PATH"

      - name: Show toolchain and simulator runtimes
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodegen --version
          xcbeautify --version
          xcrun simctl list runtimes available

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test simulator selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Resolve an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          if ! DEVICE_ID=$(python3 .github/scripts/pick_simulator.py "$RUNNER_TEMP/devices.json" --runtime "$IOS_SIMULATOR_RUNTIME"); then
            xcrun simctl list devices available
            exit 1
          fi
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build & test (unit tests)
        id: build_test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}" \
            -only-testing:PromptCamTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify

      - name: Upload xcresult bundle on failure
        if: ${{ failure() && steps.build_test.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7
          if-no-files-found: warn
