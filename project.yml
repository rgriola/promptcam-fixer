name: PromptCam
options:
  bundleIdPrefix: com.rgriola
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"

configs:
  Debug: debug
  Release: release

targets:
  PromptCam:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PromptCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rgriola.promptcam
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: PromptCam needs camera access to record videos.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: PromptCam can record microphone audio with your videos.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: PromptCam needs photo library access to save recordings.
    dependencies: []

  PromptCamTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PromptCamTests
    dependencies:
      - target: PromptCam

  PromptCamUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PromptCamUITests
    dependencies:
      - target: PromptCam

schemes:
  PromptCam:
    build:
      targets:
        PromptCam: all
        PromptCamTests: [test]
        PromptCamUITests: [test]
    test:
      targets:
        - name: PromptCamTests
        - name: PromptCamUITests
