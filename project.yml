name: A1-Teleprompter
options:
  bundleIdPrefix: com.rgriola
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"

configs:
  Debug: debug
  Release: release

targets:
  PromptCam:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PromptCam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PromptCam/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: PromptCam needs camera access to record videos.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: PromptCam can record microphone audio with your videos.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: PromptCam needs photo library access to save and review your recordings.

        INFOPLIST_KEY_CFBundleDisplayName: A1-Telepromter
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video

        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: SplashBg
        INFOPLIST_KEY_UILaunchScreen_ImageName: launchscreen
        INFOPLIST_KEY_UILaunchScreen_ImageRespectsSafeAreaInsets: NO

        PRODUCT_BUNDLE_IDENTIFIER: com.rgriola.promptcam
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LW5P4PVL96

    dependencies: []

  PromptCamTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PromptCamTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PromptCam

  PromptCamUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PromptCamUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PromptCam

schemes:
  PromptCam:
    build:
      targets:
        PromptCam: all
        PromptCamTests: [test]
        PromptCamUITests: [test]
    test:
      targets:
        - name: PromptCamTests
        - name: PromptCamUITests
